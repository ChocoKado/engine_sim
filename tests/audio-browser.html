<!doctype html>
<html lang="zh-TW">
<meta charset="utf-8">
<title>HYPERENGINE 音效回歸檢查</title>
<style>body{font:16px system-ui;background:#101722;color:#e2e8f0;padding:32px}pre{white-space:pre-wrap;line-height:1.6}</style>
<h1>Web Audio 音效回歸檢查</h1>
<p>離線渲染實際聲音，不透過喇叭播放；此檢查驗證音訊連續性與數值，並不代表錄音級實車還原。</p>
<pre id="results">檢查中…</pre>
<div id="rotary-previews"></div>
<script type="module">
import { SoundEngine } from '../src/audio/SoundEngine.js';
import { ENGINE_CONFIGS } from '../src/physics/EngineConfigurations.js';
import { EXHAUST_MODELS } from '../src/audio/ExhaustModels.js';

const output = document.getElementById('results');
const lines = [];
let count = 0;
const sampleRate = 48000;
const rms = (data, from = 0, to = data.length / sampleRate) => {
  const samples = data.subarray(Math.round(from * sampleRate), Math.round(to * sampleRate));
  return Math.sqrt(samples.reduce((sum, value) => sum + value * value, 0) / samples.length);
};
const finite = data => data.every(value => Number.isFinite(value) && Math.abs(value) < 1);
const check = (label, okay, detail) => {
  count++;
  lines.push((okay ? 'PASS ' : 'FAIL ') + label + ': ' + detail);
  output.textContent = lines.join('\n');
  if (!okay) throw new Error(label);
};
const silenceEngine = sound => {
  for (const name of ['pressureGain', 'combustionGain', 'harmonicGain', 'subBassGain', 'camshaftGain', 'gearWhineGain', 'intakeGain', 'turboSpoolGain', 'turboAirGain', 'scWhineGain']) {
    if (!sound[name]) continue;
    sound[name].gain.cancelScheduledValues(0);
    sound[name].gain.setValueAtTime(0, 0);
  }
};
async function render({ mode = 'at', muted = false, stopped = false, config = ENGINE_CONFIGS.i4_flat, induction = 'na', isolate = '', ecuMode = 'soft', limiterCut = 0, limiterHz = 18, camBlend = 0 } = {}) {
  const context = new OfflineAudioContext(1, 76800, sampleRate);
  const sound = new SoundEngine(() => context);
  sound.setVolume(muted ? 0 : 0.5);
  sound.setEngineConfig(config);
  await sound.init();
  sound.setRunning(true);
  const isolateLayer = () => { if (!isolate) return; for (const name of ['pressureGain', 'combustionGain', 'harmonicGain', 'subBassGain', 'camshaftGain', 'gearWhineGain', 'intakeGain']) { if (name !== isolate && sound[name]) { sound[name].gain.cancelScheduledValues(context.currentTime); sound[name].gain.setValueAtTime(0, context.currentTime); } } };
  const state = { rpm: 6000, redlineRPM: 14500, displacement: config.defaultDisplacement,
    manifoldThrottle: 0.85, isRevLimiting: false, forcedInduction: induction,
    turboRPM: 130000, superchargerRPM: 14100, inductionLoad: 0.8,
    bypassOpening: 0, airFlow: 0.30, boostPressure: induction === 'na' ? 0 : 1.0,
    ecuMode, revLimiterCutAmount: limiterCut, limiterHz, limiterDepth: 1, camBlend };
  sound.update(state, config, { mode, currentGear: 1, gearRatio: 3.5 });
  isolateLayer();
  const suspended = context.suspend(0.45);
  const rendering = context.startRendering();
  await suspended;
  if (stopped) sound.setRunning(false);
  if (muted || stopped) sound.setExhaustModel(EXHAUST_MODELS.straight);
  const cutAmount = mode === 'at' ? 0.34 : 0.90;
  // Actual shift flags and torque telemetry, previously missing from this test.
  sound.update({ ...state, ignitionCut: true, torqueScale: 1 - cutAmount }, config,
    { mode, currentGear: 1, gearRatio: 3.5, isShifting: true, isUpshift: true, shiftPhase: 'release', cutAmount, shiftEnvelope: 1 });
  isolateLayer();
  const recovered = context.suspend(0.55);
  await context.resume();
  await recovered;
  sound.update({ ...state, rpm: 3800, ignitionCut: false, torqueScale: 1 }, config,
    { mode, currentGear: 2, gearRatio: 2.15, isShifting: false, isUpshift: false, cutAmount: 0 });
  isolateLayer();
  await context.resume();
  return { data: (await rendering).getChannelData(0), backend: sound.acousticBackend, workletError: sound.workletError };
}
async function renderTransient({ exhaust = EXHAUST_MODELS.straight, muted = false, type = 'pop', pressure = 1 } = {}) {
  const context = new OfflineAudioContext(1, 48000, sampleRate);
  const sound = new SoundEngine(() => context);
  sound.setVolume(muted ? 0 : 0.5);
  sound.setExhaustModel(exhaust);
  await sound.init();
  sound.setRunning(true);
  silenceEngine(sound);
  if (type === 'pop') sound.playBackfirePop(exhaust.popIntensity, true, false, 0.15);
  else {
    const event = { intensity: 0.9, pressure, rotorRPM: 100000 + pressure * 35000, when: 0.15 };
    if (type === 'flutter') sound.playFlutterSound(event);
    else sound.playBovSound(event);
  }
  return (await context.startRendering()).getChannelData(0);
}
async function renderLimiter() {
  const context = new OfflineAudioContext(1, 96000, sampleRate);
  const sound = new SoundEngine(() => context);
  sound.setVolume(0.5);
  sound.setEngineConfig(ENGINE_CONFIGS.i2_180);
  await sound.init();
  sound.setRunning(true);
  const state = { rpm: 9900, redlineRPM: 10000, displacement: 399,
    manifoldThrottle: 1, isRevLimiting: false, revLimiterCutAmount: 0 };
  sound.update(state, ENGINE_CONFIGS.i2_180, { currentGear: 6, cutAmount: 0 });
  const limiting = context.suspend(0.35);
  const rendering = context.startRendering();
  await limiting;
  sound.update({ ...state, isRevLimiting: true, revLimiterCutAmount: 0.70 }, ENGINE_CONFIGS.i2_180,
    { currentGear: 6, cutAmount: 0 });
  const recovery = context.suspend(1.25);
  await context.resume();
  await recovery;
  sound.update(state, ENGINE_CONFIGS.i2_180, { currentGear: 6, cutAmount: 0 });
  await context.resume();
  return { data: (await rendering).getChannelData(0), backend: sound.acousticBackend };
}
async function renderRotaryIdle({ rotaryIdleMode = 'stock', exhaust = EXHAUST_MODELS.oem, rpm = 850, throttle = 0.045, muted = false, stopped = false } = {}) {
  const context = new OfflineAudioContext(1, sampleRate * 4, sampleRate);
  const sound = new SoundEngine(() => context);
  sound.setVolume(muted ? 0 : 0.5);
  sound.setEngineConfig(ENGINE_CONFIGS.rotary_2);
  sound.setExhaustModel(exhaust);
  sound.setRotaryIdleMode(rotaryIdleMode);
  await sound.init(); sound.setRunning(true);
  const state = { rpm, redlineRPM: 9000, displacement: 1308, manifoldThrottle: throttle,
    forcedInduction: 'na', torqueScale: 1, revLimiterCutAmount: 0 };
  sound.update(state, ENGINE_CONFIGS.rotary_2, { currentGear: 0 });
  let data;
  if (stopped) {
    const suspended = context.suspend(2);
    const rendering = context.startRendering();
    await suspended;
    sound.setRunning(false); sound.setRotaryIdleMode('stock'); sound.setExhaustModel(EXHAUST_MODELS.straight);
    await context.resume(); data = (await rendering).getChannelData(0);
  } else data = (await context.startRendering()).getChannelData(0);
  return { data, backend: sound.acousticBackend };
}
async function renderRotaryModeChanges() {
  const context = new OfflineAudioContext(1, sampleRate * 12, sampleRate);
  const sound = new SoundEngine(() => context);
  const config = ENGINE_CONFIGS.rotary_2;
  sound.setVolume(0.5); sound.setEngineConfig(config); sound.setExhaustModel(EXHAUST_MODELS.straight);
  await sound.init(); sound.setRunning(true);
  const idle = { rpm: 850, redlineRPM: 9000, displacement: 1308, manifoldThrottle: 0.045,
    forcedInduction: 'na', torqueScale: 1, revLimiterCutAmount: 0 };
  sound.update(idle, config, { currentGear: 0 });
  let suspended = context.suspend(2);
  const rendering = context.startRendering();
  await suspended;
  sound.setRotaryIdleMode('brap');
  suspended = context.suspend(5); await context.resume(); await suspended;
  sound.setRotaryIdleMode('stock');
  suspended = context.suspend(8); await context.resume(); await suspended;
  sound.setRotaryIdleMode('brap');
  sound.update({ ...idle, rpm: 6000, manifoldThrottle: 0.8 }, config, { currentGear: 0 });
  suspended = context.suspend(10); await context.resume(); await suspended;
  sound.setRotaryIdleMode('stock');
  await context.resume();
  return { data: (await rendering).getChannelData(0), backend: sound.acousticBackend };
}
const envelopeVariation = (data, from = 0.5, to = 4) => {
  const levels = [];
  for (let t = from; t + 0.05 <= to; t += 0.05) levels.push(rms(data, t, t + 0.05));
  const mean = levels.reduce((sum, value) => sum + value, 0) / levels.length;
  return Math.sqrt(levels.reduce((sum, value) => sum + (value - mean) ** 2, 0) / levels.length) / mean;
};
function normalizedTone(data, hz, from, to) {
  const start = Math.round(from * sampleRate), end = Math.round(to * sampleRate);
  let real = 0, imag = 0;
  for (let i = start; i < end; i++) {
    const angle = 2 * Math.PI * hz * i / sampleRate;
    real += data[i] * Math.cos(angle); imag += data[i] * Math.sin(angle);
  }
  return 2 * Math.hypot(real, imag) / (end - start) / rms(data, from, to);
}
function addAudioPreview(data, label, filename) {
  // Export the same tested Web Audio samples as a small mono PCM WAV.
  const bytes = new ArrayBuffer(44 + data.length * 2), view = new DataView(bytes);
  const word = (offset, text) => { [...text].forEach((char, i) => view.setUint8(offset + i, char.charCodeAt(0))); };
  word(0, 'RIFF'); view.setUint32(4, 36 + data.length * 2, true); word(8, 'WAVE'); word(12, 'fmt ');
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  word(36, 'data'); view.setUint32(40, data.length * 2, true);
  data.forEach((value, i) => view.setInt16(44 + i * 2, Math.round(Math.max(-1, Math.min(1, value)) * 32767), true));
  const url = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
  const row = document.createElement('p'), audio = document.createElement('audio'), link = document.createElement('a');
  audio.controls = true; audio.src = url; link.href = url; link.download = filename; link.textContent = `下載 ${label}`;
  row.append(label + '（直通排氣、850 RPM） ', audio, ' ', link); document.getElementById('rotary-previews').append(row);
}
try {
  const shiftRatios = {};
  for (const mode of ['at', 'amt']) {
    const { data, backend, workletError } = await render({ mode });
    check(mode.toUpperCase() + ' 採用逐樣本燃燒壓力', backend === 'pressure-worklet', backend + (workletError || ''));
    check(mode.toUpperCase() + ' 波形有限且無削波', finite(data), 'peak = ' + Math.max(...data.map(Math.abs)).toFixed(3));
    const before = rms(data, 0.3, 0.4);
    const during = rms(data, 0.49, 0.535);
    shiftRatios[mode] = during / before;
    check(mode.toUpperCase() + ' 換檔維持運轉背景', before > 0.005 && during > 0.001,
      '斷點 RMS / 換檔前 RMS = ' + shiftRatios[mode].toFixed(3));
    check(mode.toUpperCase() + ' 接合後恢復排氣', rms(data, 0.75, 0.85) > 0.015,
      '恢復 RMS = ' + rms(data, 0.75, 0.85).toFixed(4));
  }
  const { data: pressureOnly } = await render({ mode: 'amt', isolate: 'pressureGain' });
  check('燃燒 Worklet 實際產生聲音', rms(pressureOnly, 0.3, 0.4) > 0.015 && finite(pressureOnly), '隔離燃燒 RMS = ' + rms(pressureOnly, 0.3, 0.4).toFixed(4));
  check('AMT 斷點比 AT 明確', shiftRatios.amt < shiftRatios.at * 0.65 && shiftRatios.amt < 0.6,
    'AT = ' + shiftRatios.at.toFixed(3) + ', AMT = ' + shiftRatios.amt.toFixed(3));
  const { data: muted } = await render({ muted: true });
  check('靜音後更換排氣管仍保持靜音', rms(muted) === 0, 'RMS = ' + rms(muted));
  const { data: stopped } = await render({ stopped: true });
  check('熄火後更換排氣管不會恢復聲音', rms(stopped, 1, 1.15) < 0.00001,
    'RMS = ' + rms(stopped, 1, 1.15).toExponential(3));
  const { data: flat } = await render();
  const { data: cross } = await render({ config: ENGINE_CONFIGS.i4_cross });
  const difference = flat.map((value, index) => value - cross[index]);
  check('I4 與 CP4 点火相位產生不同音訊', rms(difference, 0.2, 0.4) > 0.01,
    '差異 RMS = ' + rms(difference, 0.2, 0.4).toFixed(4));
  const burstLevels = [];
  for (const id of ['oem', 'akrapovic', 'sc_project', 'straight']) {
    const burst = await renderTransient({ exhaust: EXHAUST_MODELS[id] });
    burstLevels.push(rms(burst, 0.15, 0.4));
    check(id + ' 回火無削波', finite(burst), 'RMS = ' + burstLevels.at(-1).toFixed(4));
  }
  check('回火聲能依排氣管遞增', burstLevels[0] === 0 && burstLevels.every((level, i) => i === 0 || level > burstLevels[i - 1]),
    'OEM < 蠍管 < SC < 直通');
  const mutedBurst = await renderTransient({ muted: true });
  check('強烈回火仍遵守靜音', rms(mutedBurst) === 0, 'RMS = ' + rms(mutedBurst));
  for (const type of ['bov', 'flutter']) {
    const low = await renderTransient({ type, pressure: 0.15 });
    const high = await renderTransient({ type, pressure: 1.5 });
    check(type + ' 壓力改變音量及洩壓時間', rms(high) > rms(low) * 1.5 && rms(high, 0.38, 0.5) > rms(low, 0.38, 0.5),
      '低壓 RMS = ' + rms(low).toFixed(4) + ', 高壓 = ' + rms(high).toFixed(4));
    check(type + ' 高壓聲浪無削波', finite(high), 'peak = ' + Math.max(...high.map(Math.abs)).toFixed(3));
    const silent = await renderTransient({ type, pressure: 1.5, muted: true });
    check(type + ' 遵守靜音', rms(silent) === 0, 'RMS = ' + rms(silent));
  }
  for (const induction of ['turbo', 'supercharger']) {
    const { data } = await render({ mode: 'amt', induction, config: ENGINE_CONFIGS.v8_cross });
    check(induction + ' 增壓與換檔音訊有限且持續', finite(data) && rms(data, 0.49, 0.535) > 0.002,
      '斷點 RMS = ' + rms(data, 0.49, 0.535).toFixed(4));
  }
  const { data: limiter, backend: limiterBackend } = await renderLimiter();
  check('漸進限轉採用燃燒 Worklet', limiterBackend === 'pressure-worklet', limiterBackend);
  check('持續限轉無靜音空白及削波', finite(limiter) && rms(limiter, 0.6, 1.1) > 0.002,
    '限轉 RMS = ' + rms(limiter, 0.6, 1.1).toFixed(4));
  check('解除限轉後恢復連續排氣', rms(limiter, 1.5, 1.9) > 0.01,
    '恢復 RMS = ' + rms(limiter, 1.5, 1.9).toFixed(4));
  for (const id of ['honda_f20c', 'honda_k20a', 'boxer4', 'boxer6', 'rotary_2']) {
    const { data, backend } = await render({ config: ENGINE_CONFIGS[id] });
    check(id + ' 實際 Worklet 聲浪有限且連續', backend === 'pressure-worklet' && finite(data) && rms(data, 0.3, 0.4) > 0.005,
      'RMS = ' + rms(data, 0.3, 0.4).toFixed(4));
  }
  const ecuAudio = {};
  for (const ecuMode of ['soft', 'hard', 'sequential']) {
    const { data } = await render({ ecuMode, limiterCut: 0.55, limiterHz: 18 });
    ecuAudio[ecuMode] = data;
    check(ecuMode + ' 斷油仍保留連續背景', finite(data) && rms(data, 0.3, 0.4) > 0.002, 'RMS = ' + rms(data, 0.3, 0.4).toFixed(4));
  }
  for (const ecuMode of ['hard', 'sequential']) {
    const difference = ecuAudio.soft.map((value, index) => value - ecuAudio[ecuMode][index]);
    check(ecuMode + ' 與柔和模式產生不同音訊', rms(difference, 0.2, 0.4) > 0.01,
      '差異 RMS = ' + rms(difference, 0.2, 0.4).toFixed(4));
  }
  const { data: highCam } = await render({ config: ENGINE_CONFIGS.honda_k20a, camBlend: 1, isolate: 'intakeGain' });
  const { data: lowCam } = await render({ config: ENGINE_CONFIGS.honda_k20a, camBlend: 0, isolate: 'intakeGain' });
  check('VTEC 高凸輪實際增強進氣聲', rms(highCam, 0.3, 0.4) > rms(lowCam, 0.3, 0.4) * 1.20 && finite(highCam),
    '高 / 低凸輪 RMS = ' + (rms(highCam, 0.3, 0.4) / rms(lowCam, 0.3, 0.4)).toFixed(3));
  const rotaryIdle = {};
  for (const rotaryIdleMode of ['stock', 'brap']) {
    for (const id of ['oem', 'akrapovic', 'sc_project', 'straight']) {
      const { data, backend } = await renderRotaryIdle({ rotaryIdleMode, exhaust: EXHAUST_MODELS[id] });
      rotaryIdle[`${rotaryIdleMode}:${id}`] = data;
      check(`轉子 ${rotaryIdleMode} / ${id} 怠速音訊穩定且無削波`, backend === 'pressure-worklet' && finite(data) && rms(data, 0.5, 3.9) > 0.001,
        'RMS = ' + rms(data, 0.5, 3.9).toFixed(4));
    }
  }
  const stockVariation = envelopeVariation(rotaryIdle['stock:straight']);
  const brapVariation = envelopeVariation(rotaryIdle['brap:straight']);
  check('改裝 Brap 的怠速強弱段落大於原廠', brapVariation > stockVariation * 1.5,
    `包絡變異係數：原廠 ${stockVariation.toFixed(3)} / Brap ${brapVariation.toFixed(3)}`);
  const { data: silentRotary } = await renderRotaryIdle({ rotaryIdleMode: 'brap', muted: true });
  check('Brap 怠速遵守靜音', rms(silentRotary) === 0, 'RMS = ' + rms(silentRotary));
  const { data: stoppedRotary } = await renderRotaryIdle({ rotaryIdleMode: 'brap', stopped: true });
  check('Brap 熄火後切模式／排氣保持靜音', rms(stoppedRotary, 2.5, 3.9) < 0.00001,
    'RMS = ' + rms(stoppedRotary, 2.5, 3.9).toExponential(3));
  const { data: highRotary } = await renderRotaryIdle({ rotaryIdleMode: 'brap', rpm: 6000, throttle: 0.8 });
  check('Brap 拉轉後保持連續音訊', finite(highRotary) && envelopeVariation(highRotary) < brapVariation * 0.6,
    '高轉包絡變異 = ' + envelopeVariation(highRotary).toFixed(3));
  const { data: switchedRotary, backend: switchedBackend } = await renderRotaryModeChanges();
  const firstIdleRms = rms(switchedRotary, 0.5, 1.9);
  let transitionFloor = Infinity;
  for (const when of [2, 5, 8, 10]) {
    for (let t = when - 0.12; t <= when + 0.12; t += 0.01) {
      transitionFloor = Math.min(transitionFloor, rms(switchedRotary, t, t + 0.02));
    }
  }
  check('運轉中切換原廠／Brap 聲浪不產生靜音空白', switchedBackend === 'pressure-worklet' && finite(switchedRotary)
    && firstIdleRms > 0.001 && transitionFloor > firstIdleRms * 0.01,
    `切換附近最小 20ms RMS = ${transitionFloor.toFixed(5)}`);
  const firstIdleVariation = envelopeVariation(switchedRotary, 0.5, 1.9);
  const switchedBrapVariation = envelopeVariation(switchedRotary, 2.5, 4.9);
  const recoveredIdleVariation = envelopeVariation(switchedRotary, 5.5, 7.9);
  const recoveredPulse = normalizedTone(switchedRotary, 850 / 30, 5.5, 7.9);
  const recoveredLevel = rms(switchedRotary, 5.5, 7.9) / firstIdleRms;
  check('切回原廠後恢復正確怠速脈衝並解除 Brap 段落', switchedBrapVariation > firstIdleVariation * 1.5
    && recoveredIdleVariation < switchedBrapVariation * 0.55 && recoveredIdleVariation < firstIdleVariation + 0.08
    && recoveredPulse > 0.05 && recoveredLevel > 0.8 && recoveredLevel < 1.2,
    `包絡 CV ${firstIdleVariation.toFixed(3)} → ${switchedBrapVariation.toFixed(3)} → ${recoveredIdleVariation.toFixed(3)}；28.33Hz 脈衝 ${recoveredPulse.toFixed(3)}`);
  const switchedHighVariation = envelopeVariation(switchedRotary, 8.5, 9.9);
  const stockHighVariation = envelopeVariation(switchedRotary, 10.5, 11.9);
  const highLevelRatio = rms(switchedRotary, 8.5, 9.9) / rms(switchedRotary, 10.5, 11.9);
  check('切換後高轉負載不殘留 Brap 包絡或音量偏差', switchedHighVariation < switchedBrapVariation * 0.25
    && stockHighVariation < switchedBrapVariation * 0.25 && Math.abs(switchedHighVariation - stockHighVariation) < 0.03
    && highLevelRatio > 0.9 && highLevelRatio < 1.1,
    `6000 RPM 包絡 CV ${switchedHighVariation.toFixed(3)} / ${stockHighVariation.toFixed(3)}；音量比 ${highLevelRatio.toFixed(3)}`);
  addAudioPreview(rotaryIdle['stock:straight'], '原廠轉子怠速', 'rotary-stock-idle.wav');
  addAudioPreview(rotaryIdle['brap:straight'], '改裝 Brap 怠速', 'rotary-brap-idle.wav');
  lines.push('全部 ' + count + ' 項音訊渲染檢查通過');
  output.textContent = lines.join('\n');
  document.body.dataset.result = 'passed';
} catch (error) {
  output.textContent = lines.join('\n') + '\nERROR: ' + error.stack;
  document.body.dataset.result = 'failed';
}
</script>
</html>
